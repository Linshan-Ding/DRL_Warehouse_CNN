# E4 -- discount-factor ablation (Reviewer #2, comment 3).
#
# With r_t = F_bar_{t-1} - F_bar_t the undiscounted return telescopes exactly to
# -F_bar_final. Under discounting the return equals
#   F_bar_0 - gamma^{T-1} F_bar_T - (1 - gamma) * sum_t gamma^{t-1} F_bar_t,
# so the objectives stay aligned but are no longer identical. This overlay
# sweeps gamma to measure how much that O(1-gamma) term actually matters.
# Run each value at least three times; the runs are independent because no
# random seed is fixed.
algo:
  gamma: 0.99
