# The 3 x 3 x 3 = 27 fixed evaluation cases and the order-stream parameters.
# Each case Cxx gets its own materialised order stream (CSV); these files, not
# a random seed, are the reproduction baseline.  Training streams are sampled
# fresh every episode and never written to disk.
instance:
  n_orders: 100
  min_items_per_order: 5
  max_items_per_order: 5

  case_interarrivals: [20.0, 40.0, 60.0]   # 1/lambda, outer loop of the numbering
  case_pickers: [1, 2, 3]                  # K, middle loop
  case_robots: [2, 4, 6]                   # R, inner loop

  # Validation streams (checkpoint selection): one per arrival rate, each
  # evaluated on the fleet mini-grid train.val_fleets during training.
  val_streams_per_lambda: 1

  instances_dir: data/instances
