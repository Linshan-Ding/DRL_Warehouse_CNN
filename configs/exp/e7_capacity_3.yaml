# E7 -- AMR carrying capacity (Reviewer #1).
#
# C = 3: an AMR takes up to 3 orders per service cycle, visits the union of
# their required picking points and is packed once per order on return.
# C = 1 reproduces assumption (A1) of the submitted manuscript exactly, so this
# overlay generalises the model rather than replacing it.
#
# Note: a larger C lengthens each robot tour. Without a companion routing
# improvement the mean flow time does not have to improve monotonically in C --
# report whatever the runs show.
env:
  robot_capacity: 3
