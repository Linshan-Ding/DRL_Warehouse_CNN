# E1 -- picker : robot ratio scenarios (Reviewer #1).
# K = 4 pickers, R = 2 robots on the C18 arrival stream.
# The 27 published cases already cover the ratios 1:2, 1:4, 1:6, 1:1 (K=2,R=2),
# 2:4, 2:6, 3:2, 3:4 and 3:6; this overlay adds the extreme configurations that
# were missing, so that 1:1 and n:1 operating modes can be compared as well.
env:
  n_pickers: 4
  n_robots: 2
instance:
  mean_interarrival: 40.0
