# Warehouse geometry, resources, service times and the observation.
# Values reproduce Table 3 of the manuscript.  The (n_pickers, n_robots,
# robot_capacity, pick_time, layout) fields describe the DEFAULT scenario;
# during training every episode overrides them by sampling from the scenario
# table in train.yaml, and during evaluation eval.py overrides them per case.
env:
  # --- picking-point grid (Eq. 1) ---
  n_aisles: 9                 # N_w
  n_positions: 20             # N_l
  shelf_length: 1.0           # S_l
  shelf_width: 1.0            # S_w
  aisle_width: 2.0            # S_a
  bottom_aisle_width: 2.0     # S_b
  entrance_width: 2.0         # S_d
  depot_position: [18.0, 0.0]
  layout: two_cross_aisles    # three_cross_aisles adds a middle cross-aisle

  # --- default scenario resources ---
  n_robots: 6                 # R
  n_pickers: 3                # K
  robot_speed: 3.0            # v_r (m/s)
  picker_speed: 0.75          # v_k (m/s)
  robot_capacity: 1           # C, orders per service cycle

  # --- resource envelope: ONE policy file serves every (K, R) scenario ---
  # The actor head is sized for (k_max, r_max); resources that do not exist in
  # the current scenario are permanently masked.  Grid-size sensitivity
  # (Tables 11-12) changes the input geometry and therefore trains per grid.
  k_max: 10
  r_max: 20
  capacity_max: 3             # normaliser of the C context plane
  pick_time_ref: 20.0         # normaliser of the tau context plane

  # --- service times ---
  pick_time: 10.0             # tau_pick
  pack_time: 20.0             # tau_pack

  # --- observation ---
  # base       -> 4 spatial channels + 5 configuration planes = 9
  # plus_agent -> base + 2 per-robot channels                 = 11 (ablation)
  state_channels: base

  max_steps: 20000
