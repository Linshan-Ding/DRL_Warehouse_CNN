# SAPPO training hyperparameters.
# Every value reproduces Table 4 of the manuscript.  They were taken from the
# implementation that produced the submitted results; no exhaustive
# hyperparameter search was performed (see docs/experiment-spec.md).
algo:
  actor_lr: 1.0e-4            # alpha_pi
  critic_lr: 3.0e-5           # alpha_V
  gamma: 0.99                 # discount factor
  gae_lambda: 0.95            # GAE lambda
  clip_eps: 0.2               # PPO clipping epsilon
  value_coef: 0.2             # c_1
  entropy_coef: 0.01          # c_2
  max_grad_norm: 0.5          # g_max
  ppo_epochs: 2               # N_epoch
  minibatch_size: 64          # B
  ratio_cap: 5.0              # rho_max
  advantage_clip: 5.0         # advantage clipping after standardisation

  cnn_output_dim: 256
  policy_hidden: 2048
  value_hidden: 1024

  n_episodes: 2000
  update_every_episodes: 1
  eval_interval: 10
  n_eval_episodes: 3

  device: auto
