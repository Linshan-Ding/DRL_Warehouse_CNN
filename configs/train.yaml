# Global-policy training: one policy file per algorithm, trained on scenarios
# sampled fresh every episode, collected by parallel worker processes.
train:
  n_episodes: 15000
  n_workers: 0                # 0 = auto (cpu_count - 2); workers use 1 torch thread each
  episodes_per_round: 0       # 0 = one episode per worker per round

  # Scenario sampling (weights renormalised):
  w_main: 0.70                # the 27-case grid: lambda x K x R uniform
  w_scale: 0.15               # larger fleets and extreme ratios below
  w_perturb: 0.15             # capacity / pick-time / layout perturbations
  scale_configs: [[4, 8], [5, 10], [6, 12], [8, 16], [10, 20], [1, 1], [3, 1], [4, 2]]
  perturb_capacities: [2, 3]
  perturb_pick_times: [15.0, 20.0]
  perturb_layout_prob: 0.34   # probability that a perturbed episode uses the middle cross-aisle

  # Rounds between the periodic evaluations (validation mini-grid for
  # checkpoint selection + the representative-case curves).  Validation covers
  # 3 lambda streams x 3 fleets (val_fleets) = 9 greedy episodes, plus 4 curve
  # cases: 13 greedy episodes in the main process (~1-2 min) while the workers
  # idle, so smaller values buy curve density at a throughput cost.  10 rounds
  # with 8 workers = one curve point every ~80 episodes.
  eval_interval: 10
  val_fleets: [[1, 2], [2, 4], [3, 6]]   # (K, R) grid for checkpoint selection
  curve_cases: [C06, C13, C15, C24]   # logged for the Fig. 8 style training curves

# SAPPO (PPO) hyperparameters -- revised-manuscript Table 4.
# R2 changes vs the R1 table: minibatch 64 -> 256, ppo_epochs 2 -> 4 with a
# KL-based early stop (kl_target), learning rates and entropy coefficient
# decay linearly over the episode budget.  On top of these Table-4 entries the
# implementation normalises critic targets and standardises advantages per
# episode (advantage_norm) -- both required by mixed-scenario global training.
algo:
  actor_lr: 1.0e-4            # decays linearly to actor_lr * lr_end_factor
  critic_lr: 3.0e-5           # same schedule as the actor
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  value_coef: 0.2
  entropy_coef: 0.01          # decays linearly to entropy_coef_end
  max_grad_norm: 0.5
  ppo_epochs: 4               # upper bound; kl_target stops epochs early
  minibatch_size: 256
  ratio_cap: 5.0
  advantage_clip: 5.0
  advantage_norm: per_episode # per_episode (equal voice per scenario) | batch
  kl_target: 0.02
  lr_end_factor: 0.1
  entropy_coef_end: 0.002
  cnn_output_dim: 256
  policy_hidden: 2048
  value_hidden: 1024
  device: auto

# Baselines (base algorithms of the cited methods) -- common settings follow
# manuscript Table 6: lr 1e-4, gamma 0.99, batch 64, replay 100k (float16),
# target sync every 2000 transitions, rollout 200 (SOA+A2C) / 20 (DRLG).
baselines:
  lr: 1.0e-4
  gamma: 0.99
  batch_size: 64
  replay_size: 100000
  target_update: 2000
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_episodes: 5000
  dqn_train_freq: 4
  eval_epsilon: 0.05
  a2c_n_step: 200
  drlg_n_step: 20
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
