# Warehouse geometry, mobile resources and service times.
# Values reproduce Table 3 of the manuscript.  The baseline resource setting is
# case C18 (K = 3 pickers, R = 6 robots), which the manuscript uses as the
# reference point for every sensitivity study.
env:
  # --- picking-point grid (Eq. 1) ---
  n_aisles: 9                 # N_w
  n_positions: 20             # N_l
  shelf_length: 1.0           # S_l, picking-point spacing
  shelf_width: 1.0            # S_w, rack width
  aisle_width: 2.0            # S_a, vertical aisle width
  bottom_aisle_width: 2.0     # S_b, bottom cross-aisle width
  entrance_width: 2.0         # S_d, left boundary to first aisle
  depot_position: [18.0, 0.0]

  # Travel-distance model (Eq. 2).
  #   two_cross_aisles   : bottom + top cross-aisle, as in the manuscript
  #   three_cross_aisles : adds a middle cross-aisle (experiment E8 only)
  layout: two_cross_aisles

  # --- mobile resources ---
  n_robots: 6                 # R
  n_pickers: 3                # K
  robot_speed: 3.0            # v_r  (m/s)
  picker_speed: 0.75          # v_k  (m/s)

  # Orders carried by one AMR per service cycle.
  # C = 1 is assumption (A1) of the submitted manuscript.
  robot_capacity: 1           # C

  # --- service times ---
  pick_time: 10.0             # tau_pick, per item
  pack_time: 20.0             # tau_pack, per order

  # Observation given to the policy.
  #   base       : the four channels of Section 4.2
  #   plus_agent : base + 2 channels exposing per-resource information
  #                (experiment E5 only)
  state_channels: base

  max_steps: 20000
